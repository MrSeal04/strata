[workspace]
resolver = "3"
members = ["crates/strata-engine", "crates/strata-store", "crates/strata-server", "crates/strata-cli"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
