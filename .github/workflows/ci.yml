# make check on every push and pull request: fmt, clippy, the Rust tests (git oracles included),
# tsc and vitest. Links the prebuilt libduckdb, so it needs no DuckDB compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Registry only: a restored target/ replays libduckdb-sys's build output, which points the
      # linker at target/duckdb-download, and that isn't cached ("unable to find library -lduckdb").
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: make check
